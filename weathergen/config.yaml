# ============================================================================
# weathergen — configuration unique du générateur stochastique de météo.
# Aucun "magic number" dans le code : tout paramètre de modélisation vit ici.
# ============================================================================

run:
  seed: 20260629                 # graine unique -> reproductibilité totale
  models_dir: "models"           # objets ajustés sérialisés (gitignore)
  reports_dir: "reports"         # rapports de validation (gitignore)

# --- Source de données -------------------------------------------------------
data:
  source: "pricemodeling_sqlite" # 'pricemodeling_sqlite' | 'synthetic' (smoke)
  sqlite_path: "../data/pricemodeling.db"
  master_table: "master_hourly"
  station_table: "dim_station"
  # Filtre des stations : métropole uniquement (cf. DECISIONS.md).
  station_filter:
    bbox: { lat_min: 41.0, lat_max: 52.0, lon_min: -6.0, lon_max: 10.0 }
    ids: []                      # vide => toutes celles dans la bbox
  period: { start: "2014-12-15", end: "2026-01-31" }
  # --- Points VOISINS (hors France) -----------------------------------------------------------------
  # Le générateur n'a jamais couvert que la France : 42 stations Météo-France, et le dispatch en déduisait
  # la météo de CHAQUE zone voisine par régression sur la température FRANÇAISE. Une vague de froid
  # danoise n'existait donc que si la France en avait une à la même heure, ce qui surestime la simultanéité
  # des pointes européennes — précisément le biais qui compte pour l'adéquation et les imports.
  #
  # Ces points n'ont AUCUNE observation station : ils sont 100 % ERA5. La chaîne le supporte déjà sans
  # modification — `_bias_correct_monthly` retombe sur les statistiques d'ERA5 pour les mois jamais
  # observés, donc la correction devient l'identité, et `infill_long_gaps` remplit tout le reste.
  #
  # Choix des points : barycentres de charge (température → demande) plus des sites éoliens/solaires
  # représentatifs (vent 100 m et nébulosité → EnR). Le nombre par zone suit la taille et la diversité
  # climatique de la zone, pas sa seule superficie.
  neighbour_stations:
    - { id: NB_DE_HAM, name: "Hamburg",      zone: DE_LU,    lat: 53.63, lon:  9.99, elev:  16 }
    - { id: NB_DE_BER, name: "Berlin",       zone: DE_LU,    lat: 52.47, lon: 13.40, elev:  46 }
    - { id: NB_DE_KOL, name: "Koeln",        zone: DE_LU,    lat: 50.87, lon:  7.16, elev:  92 }
    - { id: NB_DE_MUC, name: "Muenchen",     zone: DE_LU,    lat: 48.35, lon: 11.79, elev: 447 }
    - { id: NB_DE_BRE, name: "Bremen",       zone: DE_LU,    lat: 53.05, lon:  8.79, elev:   4 }
    - { id: NB_BE_BRU, name: "Bruxelles",    zone: BE,       lat: 50.90, lon:  4.48, elev:  56 }
    - { id: NB_BE_OST, name: "Oostende",     zone: BE,       lat: 51.20, lon:  2.87, elev:   5 }
    - { id: NB_NL_AMS, name: "Amsterdam",    zone: NL,       lat: 52.31, lon:  4.76, elev:  -4 }
    - { id: NB_NL_GRQ, name: "Groningen",    zone: NL,       lat: 53.13, lon:  6.58, elev:   4 }
    - { id: NB_NL_RTM, name: "Rotterdam",    zone: NL,       lat: 51.96, lon:  4.44, elev:  -4 }
    - { id: NB_GB_LON, name: "London",       zone: GB,       lat: 51.48, lon: -0.45, elev:  25 }
    - { id: NB_GB_MAN, name: "Manchester",   zone: GB,       lat: 53.35, lon: -2.28, elev:  69 }
    - { id: NB_GB_GLA, name: "Glasgow",      zone: GB,       lat: 55.87, lon: -4.43, elev:   8 }
    - { id: NB_GB_CWL, name: "Cardiff",      zone: GB,       lat: 51.40, lon: -3.34, elev:  67 }
    - { id: NB_CH_ZRH, name: "Zuerich",      zone: CH,       lat: 47.46, lon:  8.55, elev: 432 }
    - { id: NB_CH_GVA, name: "Geneve",       zone: CH,       lat: 46.24, lon:  6.11, elev: 430 }
    - { id: NB_IT_MIL, name: "Milano",       zone: IT_NORTH, lat: 45.63, lon:  8.72, elev: 211 }
    - { id: NB_IT_VCE, name: "Venezia",      zone: IT_NORTH, lat: 45.50, lon: 12.35, elev:   2 }
    - { id: NB_IT_TRN, name: "Torino",       zone: IT_NORTH, lat: 45.20, lon:  7.65, elev: 301 }
    - { id: NB_ES_MAD, name: "Madrid",       zone: ES,       lat: 40.47, lon: -3.56, elev: 609 }
    - { id: NB_ES_BCN, name: "Barcelona",    zone: ES,       lat: 41.30, lon:  2.08, elev:   4 }
    - { id: NB_ES_SVQ, name: "Sevilla",      zone: ES,       lat: 37.42, lon: -5.90, elev:  34 }
    - { id: NB_ES_ZAZ, name: "Zaragoza",     zone: ES,       lat: 41.66, lon: -1.00, elev: 263 }
    - { id: NB_ES_LCG, name: "A Coruna",     zone: ES,       lat: 43.30, lon: -8.38, elev: 100 }
    - { id: NB_PT_LIS, name: "Lisboa",       zone: PT,       lat: 38.77, lon: -9.13, elev: 114 }
    - { id: NB_PT_OPO, name: "Porto",        zone: PT,       lat: 41.24, lon: -8.68, elev:  69 }
    - { id: NB_DK_CPH, name: "Koebenhavn",   zone: DK,       lat: 55.62, lon: 12.66, elev:   5 }
    - { id: NB_DK_ESB, name: "Esbjerg",      zone: DK,       lat: 55.53, lon:  8.55, elev:   3 }
    - { id: NB_PL_WAW, name: "Warszawa",     zone: PL_CZ,    lat: 52.17, lon: 20.97, elev: 110 }
    - { id: NB_PL_KRK, name: "Krakow",       zone: PL_CZ,    lat: 50.08, lon: 19.80, elev: 237 }
    - { id: NB_CZ_PRG, name: "Praha",        zone: PL_CZ,    lat: 50.10, lon: 14.26, elev: 380 }
    - { id: NB_PL_GDN, name: "Gdansk",       zone: PL_CZ,    lat: 54.38, lon: 18.47, elev: 149 }
    - { id: NB_AT_VIE, name: "Wien",         zone: AT_SI,    lat: 48.11, lon: 16.57, elev: 183 }
    - { id: NB_SI_LJU, name: "Ljubljana",    zone: AT_SI,    lat: 46.22, lon: 14.46, elev: 385 }
  # Fusion ERA5 (station = vérité, ERA5 = extension tails/saisonnalité). Actif dès la Phase 1.
  era5:
    enabled: true
    source: "arco"               # 'arco' (point time-series rapide) | 'cds' (grille mensuelle) | 'file'
    path: "../data/era5/era5_stations.nc"   # NetCDF ERA5 (grille ou déjà collocalisé)
    collocated: false            # true si déjà aux points station ; false => interpolation bilinéaire
    start: "1979-01-01"          # début de l'extension ERA5
    # Téléchargement CDS (utilisé si source: cds ; nécessite ~/.cdsapirc)
    cds:
      dataset: "reanalysis-era5-single-levels"
    # Correspondance variable ERA5 -> variable interne (conversions d'unités gérées en code).
    variable_map:
      "2t": temperature_c        # K -> °C
      "2d": dew_point_c          # K -> °C
      msl: pressure_sea_hpa      # Pa -> hPa
      "10u": _u_wind             # composantes -> wind_speed_ms = sqrt(u²+v²)
      "10v": _v_wind
      tcc: cloud_cover_pct       # fraction [0,1] -> %
      lcc: cloud_cover_low       # fraction -> (échelle station via bias-correction)
      tp: precip_1h_mm           # m (cumul horaire) -> mm
      # humidity_pct : dérivée de 2t & 2d (Magnus) si absente d'ERA5
    fusion:
      mode: "extend"             # 'extend' (préfixe ERA5 corrigé avant le début station) | 'off'
      bias_correction: "mean_std_monthly"  # DECISION P1 : léger ; upgrade quantile-mapping possible
      infill_long_gaps: true     # combler les longues lacunes station par ERA5 corrigé (flaggé)

# --- Variables modélisées ----------------------------------------------------
# Chaque variable : colonne master_hourly (moyenne France) ou motif par station,
# son type (pour le transform Phase 3) et ses bornes physiques (QC Phase 1).
variables:
  temperature_c:
    kind: gaussian               # quasi-gaussien après climatologie
    bounds: [-40.0, 55.0]
    tails: [lower, upper]        # EVT : chaud ET froid
  wind_speed_ms:
    kind: positive_skew          # >=0, asymétrique -> Yeo-Johnson/Weibull
    bounds: [0.0, 75.0]
    tails: [upper]
    zero_inflated: true          # calmes (0)
  pressure_sea_hpa:
    kind: gaussian
    bounds: [930.0, 1080.0]
    tails: [lower, upper]
  dew_point_c:
    kind: gaussian
    bounds: [-45.0, 40.0]
    tails: [lower, upper]
  # humidity_pct: NOT modeled directly (D3.2) — RH saturates at 100% (logit backfires) and
  # is derivable from temperature + dew point. It is derived post-hoc in simulate.py.
  cloud_cover_pct:
    kind: bounded_01
    bounds: [0.0, 100.0]
    tails: []
  precip_1h_mm:
    kind: intermittent           # occurrence + intensité (hurdle / latent censuré)
    bounds: [0.0, 60.0]          # borne physique horaire France (~40-50mm max)
    tails: []                    # corps empirique seul : l'EVT sur précip (log→expm1) explose (D8.1)
    wet_threshold_mm: 0.1        # seuil pluie/pas pluie

# --- Phase 2 : climatologie (régression harmonique) --------------------------
climatology:
  use_local_solar_time: true
  seasonal_harmonics: 3          # annuel + semi-annuel + ...
  diurnal_harmonics: 3
  interact_seasonal_diurnal: true
  fit_variance: true             # log σ²(doy,hour) hétéroscédastique

# --- Phase 4 : marginales EVT ------------------------------------------------
marginals:
  body: "empirical"              # corps empirique interpolé
  tail_dist: "genpareto"         # GPD (peaks-over-threshold)
  threshold_quantile: 0.95       # point de départ ; affiné par MRL/stabilité
  season_stratified: false       # DECISION Phase 4 : par défaut tails poolées

# --- Phase 5 : dépendance ----------------------------------------------------
dependence:
  copula: "t"                    # 't' (tail dependence) | 'gaussian'
  spatial_model: "matern"        # 'matern' (gd-cercle) | 'shrinkage' (Ledoit-Wolf)
  eof_variance: 0.90             # rang k = nb de PC pour ~90% de variance
  var_order: 6                   # ordre du VAR latent (persistance courte ; AR(1) résiduel pour le reste)

# --- Phase 6 : tendance climatique (externe, jamais estimée) -----------------
trend:
  enabled: false                 # off par défaut -> sortie stationnaire au climat observé
  method: "qdm"                  # quantile delta mapping
  ssp: "ssp245"                  # input simulation : 'ssp245' | 'ssp585' | ...
  cmip6_deltas_path: null        # npz : 'quantiles' (nq) + (12,nq) par variable
  baseline_year: 2020            # climat de référence (présent) du générateur
  target_year: 2050              # horizon auquel les deltas CMIP6 s'appliquent
  trend_variability: true        # deltas par quantile (changements variance/queues) vs médiane seule

# --- Phase 7 : simulation ----------------------------------------------------
simulate:
  horizon_years: 20              # >= 20 ans
  start_year: 2027
  output_format: "netcdf"        # 'netcdf' | 'parquet'
  enforce_constraints: true
  # co-génère le vent 100 m conditionné au vent 10 m simulé (pour step iv EnR ; cf. wind100.py).
  # Ajuster une fois via scripts/fit_wind100.py ; ignoré si le fichier est absent.
  wind100_model: "models/wind100.json"   # was .pkl: the file was renamed to .json, and the
  # existence check in simulate._append_wind100 tests the RAW path, so a stale suffix silently skipped
  # wind100 co-generation entirely — producing a 7-variable cube that step iv rejects outright.

# --- Phase 8 : validation ----------------------------------------------------
validate:
  acf_max_lag_h: 48
  holdout_years: []              # ex. [2024, 2025] pour validation hors-échantillon
  spell_focus: true              # pondère fortement persistance/épisodes
